# JSREE production stack on OCI Always Free VM (infrastructure only).
# Run from the deploy/ directory, or via deploy/scripts/deploy.sh.
name: jsree

services:
  api:
    build: ../server
    image: jsree-api:${API_TAG:-latest}
    # Production secrets live in server/.env ON THE VM ONLY. Never committed.
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - api-uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?BACKEND_HOST must be set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-uploads:
  caddy-data:
  caddy-config:
